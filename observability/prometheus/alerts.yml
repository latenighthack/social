groups:
  - name: social.operations
    rules:
      - alert: SocialUnexpectedErrors
        expr: |
          (sum by (application, environment, feature, side) (increase(social_operations_total{outcome="error"}[5m]))
          / sum by (application, environment, feature, side) (increase(social_operations_total[5m])) > 0.05)
          and on (application, environment, feature, side)
          (sum by (application, environment, feature, side) (increase(social_operations_total[5m])) >= 100)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Social unexpected operation errors exceed 5%
          description: Check telemetry freshness, outcome breakdowns and correlated logs. Expected denials are excluded from the numerator.
          runbook_url: https://github.com/latenighthack/social/blob/main/observability/README.md#unexpected-errors
      - alert: SocialNewDeadLetters
        expr: sum by (application, environment, side) (increase(social_events_total{feature="messages",operation="dead_letter"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Social messages newly entered the dead-letter store
          description: Inspect send failures and retries before asking the application to retry. Server acceptance does not establish recipient delivery.
          runbook_url: https://github.com/latenighthack/social/blob/main/observability/README.md#dead-letters
  - name: social.telemetry
    rules:
      - alert: SocialTelemetryDrops
        expr: sum by (application, environment, side) (increase(social_telemetry_dropped_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Social client telemetry was dropped
          description: Rates are incomplete. Check client freshness, network failures and exporter capacity; telemetry is memory-only.
          runbook_url: https://github.com/latenighthack/social/blob/main/observability/README.md#telemetry-delivery
      - alert: SocialDiagnosticExportFailures
        expr: sum by (application, environment) (increase(social_telemetry_exports_total{result=~"error|dropped"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Social telemetry exports are failing
          description: Check client transport failures and collector reachability, credentials and capacity. Accepted client metrics are independent of diagnostic forwarding.
          runbook_url: https://github.com/latenighthack/social/blob/main/observability/README.md#telemetry-delivery
