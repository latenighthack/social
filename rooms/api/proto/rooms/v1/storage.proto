syntax = "proto3";
package com.latenighthack.social.rooms.v1;
option java_package = "com.latenighthack.social.rooms.v1";

// Server-internal encrypted invite-code custody. Never returned through an RPC.
message InviteCodeRecord {
  bytes lookup_key = 1;
  bytes ciphertext = 2;
}
message InviteCodeSecret {
  bytes room_id = 1;
  bytes group_private_key = 2;
  int64 expiry_millis = 3;
  int64 max_uses = 4;
  bytes allowed_profile_id = 5;
  int64 remaining_uses = 6;
}
