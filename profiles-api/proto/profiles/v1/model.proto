syntax = "proto3";

package com.latenighthack.social.profiles.v1;

option java_package = "com.latenighthack.social.profiles.v1";

import "common/v1/signing.proto";

// A profile's public identity: the compressed secp256r1 public key of the profile's
// key pair. The same raw value derives the profile's room and its lockers.
message ProfileId {
  bytes raw_value = 1;
}

// A profile as presented publicly: a list of disclosures, each a SignedContent whose `content`
// is an encoded DisclosurePayload signed by the profile key. Stored as a single locker in the
// profile's own room. Starts with just display name.
message Profile {
  repeated com.latenighthack.social.common.v1.SignedContent disclosures = 1;

  // The disclosed content wrapped by each SignedContent. Read a value with the typed helper,
  // which parses a SignedContent's content back to a DisclosurePayload.
  message DisclosurePayload {
    oneof content {
      DisplayName display_name = 1;
      Avatar avatar = 3;
    }

    // Binds this disclosure to the profile it belongs to, so a disclosure signed for one
    // profile cannot be replayed under another. Stamped at signing time.
    ProfileId profile_id = 2;

    message DisplayName {
      string value = 1;
    }

    // The profile's avatar photo, carried as the URL the uploaded bytes are served from.
    message Avatar {
      string download_url = 1;
    }
  }
}

// The secret half of a profile, stored as a locker in the user's account room under the
// profile-source keyspace, keyed by profile id. Protected by the account room's lock.
message ProfileSource {
  ProfileId profile_id = 1;
  bytes private_key = 2;
}

// Device-local ktstore cache wrapper for an observed profile.
message LocalProfile {
  ProfileId profile_id = 1;
  Profile profile = 2;
}
