syntax = "proto3";

package com.latenighthack.social.login.v1;

option java_package = "com.latenighthack.social.login.v1";

// Custodial multi-method login. The server binds a login method (Apple, Google, email magic-link,
// phone OTP) to an account id + account private key, holds the key on the user's behalf, and returns
// it after the method is re-proven — enabling multi-device sign-in and account recovery. It touches
// no lockers; it is a standalone gRPC service on the lockers server. Generates LoginServer (the
// server interface the service implements) and LoginServiceRpc (the client stub).

// The identity method a credential is bound to.
enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_APPLE = 1;
  PROVIDER_GOOGLE = 2;
  PROVIDER_EMAIL = 3;
  PROVIDER_PHONE = 4;
}

enum LoginResult {
  LOGIN_RESULT_UNSPECIFIED = 0;
  // Authenticate: a binding exists and `identity` is populated. Bind: the credential was stored.
  LOGIN_RESULT_OK = 1;
  // Authenticate: the method was proven but no account is bound; use `bind_ticket` to Bind.
  LOGIN_RESULT_NEEDS_BINDING = 2;
  // The presented proof (social token / magic-link token / OTP / bind ticket) is wrong or unknown.
  LOGIN_RESULT_INVALID = 3;
  // The challenge or bind ticket has expired.
  LOGIN_RESULT_EXPIRED = 4;
  // Too many failed attempts against a challenge; it is now spent.
  LOGIN_RESULT_EXHAUSTED = 5;
  // Bind: this (provider, subject) is already bound to a different account.
  LOGIN_RESULT_ALREADY_BOUND = 6;
  // A social token failed signature / issuer / audience verification.
  LOGIN_RESULT_UNAUTHORIZED = 7;
}

// The custodial secret returned on a successful recovery: the account's 33-byte compressed public
// key and its raw private key, ready to hand to the client's AccountManager.restoreAccount.
message Identity {
  bytes account_id = 1;
  bytes account_private_key = 2;
}

message AuthenticateSocialRequest {
  // APPLE or GOOGLE.
  Provider provider = 1;
  // The provider-issued OIDC id token (a signed JWT) the app obtained from the native SDK.
  string id_token = 2;
}

message StartEmailLinkRequest {
  string email = 1;
}

message CompleteEmailLinkRequest {
  string email = 1;
  // The single-use token delivered in the magic link.
  string token = 2;
}

message StartPhoneCodeRequest {
  string phone_number = 1;
}

message VerifyPhoneCodeRequest {
  string phone_number = 1;
  // The one-time code delivered by SMS.
  string code = 2;
}

// A challenge start was accepted. The token/code is delivered out of band (email/SMS); nothing
// sensitive is returned. The result is OK even for an unknown address, so this does not disclose
// whether an address is registered.
message StartChallengeResponse {
  LoginResult result = 1;
}

message AuthenticateResponse {
  LoginResult result = 1;
  // Populated only on OK (a binding exists) — the recovered account key material.
  Identity identity = 2;
  // Populated only on NEEDS_BINDING — a short-lived, single-use token authorizing a Bind for the
  // just-proven (provider, subject).
  bytes bind_ticket = 3;
}

message BindRequest {
  bytes bind_ticket = 1;
  bytes account_id = 2;
  bytes account_private_key = 3;
}

message BindResponse {
  LoginResult result = 1;
}

service Login {
  // Social (Apple/Google): verify the id token, then recover the bound key or issue a bind ticket.
  rpc AuthenticateSocial(AuthenticateSocialRequest) returns (AuthenticateResponse);

  // Email magic link: start delivers a token by email; complete proves it.
  rpc StartEmailLink(StartEmailLinkRequest) returns (StartChallengeResponse);
  rpc CompleteEmailLink(CompleteEmailLinkRequest) returns (AuthenticateResponse);

  // Phone OTP: start delivers a code by SMS; verify proves it.
  rpc StartPhoneCode(StartPhoneCodeRequest) returns (StartChallengeResponse);
  rpc VerifyPhoneCode(VerifyPhoneCodeRequest) returns (AuthenticateResponse);

  // Attach a proven login method to an account key (custodial backup). Requires a fresh bind ticket.
  rpc Bind(BindRequest) returns (BindResponse);
}
