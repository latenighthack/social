[versions]
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
coroutines = "1.9.0"
ktor = "3.0.2"
agp = "8.7.3"
kotlinInject = "0.7.1"
ktbuf = "1.1.3"
ktstore = "0.0.7"
ktcrypto = "0.0.5"
kmLogger = "2.0.3"
cache4k = "0.14.0"
micrometer = "1.10.3"
pushy = "0.15.4"
assertk = "0.28.1"
postgresql = "42.7.3"
sqliteJdbc = "3.45.3.0"
logback = "1.5.6"
logstashEncoder = "7.4"
detekt = "1.23.7"
mavenPublish = "0.30.0"

# login-service: JWT/JWKS verification for Apple/Google id tokens + SMTP via Jakarta Mail.
nimbusJoseJwt = "9.40"
angusMail = "2.0.3"
# login-domain androidMain: native Google sign-in via Credential Manager + Google Identity.
androidxCredentials = "1.3.0"
googleId = "1.1.1"

# messages-view: the Android Views renderer library + its demo/screenshot harness.
roborazzi = "1.30.0"
robolectric = "4.14.1"
androidxCoreKtx = "1.13.1"
androidxAppcompat = "1.7.0"
junit = "4.13.2"

# Peer "lockers" repo (../kitkit). Consumed from mavenLocal as SNAPSHOTs during dev
# (run `./gradlew :api:publishToMavenLocal :connector:publishToMavenLocal` in kitkit).
lockers = "0.1.6"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

ktbuf-library = { module = "com.latenighthack.ktbuf:ktbuf-library", version.ref = "ktbuf" }
ktbuf-rpc = { module = "com.latenighthack.ktbuf:ktbuf-rpc", version.ref = "ktbuf" }
ktbuf-server = { module = "com.latenighthack.ktbuf:ktbuf-server", version.ref = "ktbuf" }
ktbuf-test = { module = "com.latenighthack.ktbuf:ktbuf-test", version.ref = "ktbuf" }

kotlin-inject-runtime = { module = "me.tatarka.inject:kotlin-inject-runtime", version.ref = "kotlinInject" }
kotlin-inject-ksp = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlinInject" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# ktor client — used by remote-content-domain's helper to perform the HTTP upload/download
# (the engine is injected/supplied by the app or tests, so only -core is a library dep).
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

ktstore-library = { module = "com.latenighthack.ktstore:ktstore-library", version.ref = "ktstore" }
ktcrypto-library = { module = "com.latenighthack.ktcrypto:ktcrypto-library", version.ref = "ktcrypto" }
kmLogger = { module = "com.diamondedge:logging", version.ref = "kmLogger" }
cache4k = { module = "io.github.reactivecircus.cache4k:cache4k", version.ref = "cache4k" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
pushy = { module = "com.eatthepath:pushy", version.ref = "pushy" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

# login-service — server-only. Nimbus verifies Apple/Google id-token JWTs against their JWKS;
# angus-mail is the Jakarta Mail (SMTP) implementation for the SmtpEmailSender.
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angusMail" }

# login-domain androidMain — native Google sign-in. Credential Manager + the Google id credential.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }

# lockers artifacts. api/connector are the client-facing libraries. server/server-test
# are published to mavenLocal for integration tests (boot the real monolith in-process);
# they are not consumed by production feature code.
lockers-api = { module = "com.latenighthack.lockers:lockers-api", version.ref = "lockers" }
lockers-connector = { module = "com.latenighthack.lockers:lockers-connector", version.ref = "lockers" }
lockers-server = { module = "com.latenighthack.lockers:lockers-server", version.ref = "lockers" }
lockers-server-test = { module = "com.latenighthack.lockers:lockers-server-test", version.ref = "lockers" }

# Gradle plugin artifacts, referenced from build-logic so convention plugins can apply them.
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
plugin-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

# messages-view Android renderer + demo/screenshot deps.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
